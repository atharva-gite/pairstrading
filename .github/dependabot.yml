version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      scientific-stack:
        patterns: ["numpy", "pandas", "statsmodels", "matplotlib"]
      dev-tools:
        patterns: ["pytest*", "ruff"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
